version: '3.8'

services:
  logmind-enclave:
    build:
      context: ..
      dockerfile: deployment/Dockerfile
    container_name: logmind-linuxone-enclave
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - ENVIRONMENT=production
      - TARGET_ARCH=s390x
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    read_only: false
